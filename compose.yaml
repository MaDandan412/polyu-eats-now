services:
  app:
    build: .
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      PORT: "8000"
      CHECK_INTERVAL_SECONDS: "60"
      CHECK_CONCURRENCY: "${CHECK_CONCURRENCY:-2}"
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      EATS_DOMAIN: ${EATS_DOMAIN:?Set your registered hostname in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
